<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="100%" height="100%">
  <defs>
    <!-- Sombra suave arrojada -->
    <filter id="puckShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Gradiente radial metálico para la cara superior -->
    <radialGradient id="topDiscGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7a8b9e"/>
      <stop offset="50%" stop-color="#526374"/>
      <stop offset="100%" stop-color="#2a3542"/>
    </radialGradient>

    <!-- Gradiente vertical para el lateral 3D con curva suavizada -->
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f4e5e"/>
      <stop offset="100%" stop-color="#1c2530"/>
    </linearGradient>

    <!-- Grabado de canales interiores -->
    <linearGradient id="grooveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18202a"/>
      <stop offset="100%" stop-color="#708294"/>
    </linearGradient>

    <!-- Definición del peso tipo B (2 círculos) -->
    <g id="puck2Circles">
      <!-- Perfil lateral 3D con bordes laterales redondos (arcos continuos) -->
      <path d="M -80 0 
               A 80 35 0 0 0 80 0 
               L 80 28 
               A 80 35 0 0 1 -80 28 
               Z" 
            fill="url(#sideGrad)" />
      
      <!-- Cara superior elíptica suave -->
      <ellipse cx="0" cy="0" rx="80" ry="35" fill="url(#topDiscGrad)" stroke="#1a232e" stroke-width="0.8" />
      
      <!-- Círculo concéntrico exterior -->
      <ellipse cx="0" cy="0" rx="55" ry="24" fill="none" stroke="url(#grooveGrad)" stroke-width="2.2" />
      <ellipse cx="0" cy="0" rx="53.5" ry="23.2" fill="none" stroke="#121820" stroke-width="0.8" opacity="0.8"/>
      
      <!-- Círculo concéntrico interior -->
      <ellipse cx="0" cy="0" rx="25" ry="11" fill="none" stroke="url(#grooveGrad)" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="23.5" ry="10.2" fill="none" stroke="#121820" stroke-width="0.8" opacity="0.8"/>
    </g>
  </defs>

  <!-- Dos pesos cercanos sin tocarse -->
  <g filter="url(#puckShadow)" transform="translate(10, 10)">
    <use href="#puck2Circles" x="110" y="70" />
    <use href="#puck2Circles" x="290" y="70" />
  </g>
</svg>
