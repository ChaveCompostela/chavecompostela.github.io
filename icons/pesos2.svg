<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" width="220" height="120">
  <defs>
    <radialGradient id="metalAbombado" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f2f5f8" />
      <stop offset="25%" stop-color="#b8c2cc" />
      <stop offset="60%" stop-color="#697480" />
      <stop offset="88%" stop-color="#3d444d" />
      <stop offset="100%" stop-color="#22272c" />
    </radialGradient>

    <filter id="sombraPeso" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#sombraPeso)">
    <!-- PESO 1 (Izquierda) -->
    <g transform="translate(65, 60)">
      <circle cx="0" cy="0" r="46" fill="url(#metalAbombado)" stroke="#1e2227" stroke-width="1"/>
      <!-- Círculo exterior grabado -->
      <circle cx="0.4" cy="0.6" r="25" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.65"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#252a30" stroke-width="1.3" opacity="0.85"/>
      <!-- Círculo interior grabado -->
      <circle cx="0.4" cy="0.6" r="13" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.65"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#252a30" stroke-width="1.3" opacity="0.85"/>
    </g>

    <!-- PESO 2 (Derecha) -->
    <g transform="translate(155, 60)">
      <circle cx="0" cy="0" r="46" fill="url(#metalAbombado)" stroke="#1e2227" stroke-width="1"/>
      <!-- Círculo exterior grabado -->
      <circle cx="0.4" cy="0.6" r="25" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.65"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#252a30" stroke-width="1.3" opacity="0.85"/>
      <!-- Círculo interior grabado -->
      <circle cx="0.4" cy="0.6" r="13" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.65"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#252a30" stroke-width="1.3" opacity="0.85"/>
    </g>
  </g>
</svg>
