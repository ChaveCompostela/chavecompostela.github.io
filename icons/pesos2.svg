<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" width="220" height="120">
  <defs>
    <!-- Gradiente metálico de hierro forjado / acero pulido -->
    <linearGradient id="metalPesos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8ecef"/>
      <stop offset="25%" stop-color="#9ea7b0"/>
      <stop offset="55%" stop-color="#525a62"/>
      <stop offset="85%" stop-color="#2d3237"/>
      <stop offset="100%" stop-color="#181a1c"/>
    </linearGradient>

    <!-- Gradiente de brillo radial para el bisel y relieve exterior -->
    <radialGradient id="relieveBisel" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#8a939e" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#2a2e33" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111315" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Gradiente en relieve para los canales concéntricos internos -->
    <linearGradient id="relieveCanal" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4a5056"/>
      <stop offset="100%" stop-color="#121416"/>
    </linearGradient>

    <!-- Sombra proyectada 3D -->
    <filter id="sombraReal" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#sombraReal)">
    <!-- PESO 1 (Izquierda) -->
    <g transform="translate(65, 60)">
      <circle cx="0" cy="0" r="48" fill="url(#metalPesos)" stroke="#1a1d20" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="url(#relieveBisel)" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="32" fill="url(#metalPesos)" stroke="#1a1d20" stroke-width="1"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#relieveCanal)" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="14" fill="url(#metalPesos)" stroke="#1a1d20" stroke-width="1"/>
      <circle cx="0" cy="0" r="8" fill="url(#relieveCanal)"/>
      <circle cx="0" cy="0" r="3" fill="#111"/>
    </g>

    <!-- PESO 2 (Derecha, superpuesto) -->
    <g transform="translate(150, 60)">
      <circle cx="0" cy="0" r="48" fill="url(#metalPesos)" stroke="#1a1d20" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="url(#relieveBisel)" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="32" fill="url(#metalPesos)" stroke="#1a1d20" stroke-width="1"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#relieveCanal)" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="14" fill="url(#metalPesos)" stroke="#1a1d20" stroke-width="1"/>
      <circle cx="0" cy="0" r="8" fill="url(#relieveCanal)"/>
      <circle cx="0" cy="0" r="3" fill="#111"/>
    </g>
  </g>
</svg>
