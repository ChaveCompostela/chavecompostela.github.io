<svg width="220" height="280" viewBox="0 0 220 280" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ferro-chave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a323d"/><stop offset="25%" stop-color="#424f5e"/><stop offset="50%" stop-color="#5c6b7d"/><stop offset="75%" stop-color="#3d4957"/><stop offset="100%" stop-color="#222932"/>
    </linearGradient>
    <linearGradient id="ferro-peso" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/><stop offset="40%" stop-color="#64748b"/><stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="canto-peso" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="25%" stop-color="#475569"/><stop offset="50%" stop-color="#cbd5e1"/><stop offset="75%" stop-color="#475569"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="sombra-chave" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.3"/></filter>
  </defs>
  <!-- Taco / Cepo de madeira -->
  <rect x="45" y="242" width="130" height="20" rx="3" fill="#653b11" filter="url(#sombra-chave)"/>
  <!-- A Chave en pico estilizada -->
  <g filter="url(#sombra-chave)">
    <path d="M 89 242 L 131 242 L 127 232 L 93 232 Z" fill="url(#ferro-chave)"/>
    <path d="M 93 232 C 89 195, 71 155, 71 115 C 71 65, 95 30, 110 20 C 125 30, 149 65, 149 115 C 149 155, 131 195, 127 232 Z" fill="url(#ferro-chave)"/>
    <path d="M 90 90 C 95 60, 105 40, 110 30" stroke="#94a3b8" stroke-width="1" opacity="0.4" stroke-dasharray="2 3"/>
    <path d="M 125 150 C 130 110, 132 80, 125 50" stroke="#1e293b" stroke-width="1.2" opacity="0.3" stroke-dasharray="4 2"/>
  </g>
  <!-- Os 4 pesos con curvatura 3D idéntica -->
  <g filter="url(#sombra-chave)">
    <path d="M 31 248 C 31 254, 65 254, 65 248 L 65 259 C 65 271, 31 271, 31 259 Z" fill="url(#canto-peso)"/>
    <ellipse cx="48" cy="248" rx="17" ry="11" fill="url(#ferro-peso)"/>
    <ellipse cx="48" cy="248" rx="11" ry="7" fill="none" stroke="#0f172a" stroke-width="1.3" opacity="0.6"/><ellipse cx="48" cy="248" rx="6" ry="4" fill="none" stroke="#0f172a" stroke-width="1.3" opacity="0.6"/>
  </g>
  <g filter="url(#sombra-chave)">
    <path d="M 63 254 C 63 260, 97 260, 97 254 L 97 265 C 97 277, 63 277, 63 265 Z" fill="url(#canto-peso)"/>
    <ellipse cx="80" cy="254" rx="17" ry="11" fill="url(#ferro-peso)"/>
    <ellipse cx="80" cy="254" rx="11" ry="7" fill="none" stroke="#0f172a" stroke-width="1.3" opacity="0.6"/><ellipse cx="80" cy="254" rx="6" ry="4" fill="none" stroke="#0f172a" stroke-width="1.3" opacity="0.6"/>
  </g>
  <g filter="url(#sombra-chave)">
    <path d="M 110 255 C 110 261, 146 261, 146 255 L 146 266 C 146 278, 110 278, 110 266 Z" fill="url(#canto-peso)"/>
    <ellipse cx="128" cy="255" rx="18" ry="11" fill="url(#ferro-peso)"/>
    <ellipse cx="128" cy="255" rx="6" ry="4" fill="none" stroke="#0f172a" stroke-width="1.3" opacity="0.65"/>
  </g>
  <g filter="url(#sombra-chave)">
    <path d="M 152 248 C 152 254, 188 254, 188 248 L 188 259 C 188 272, 152 272, 152 259 Z" fill="url(#canto-peso)"/>
    <ellipse cx="170" cy="248" rx="18" ry="12" fill="url(#ferro-peso)"/>
    <ellipse cx="170" cy="248" rx="6" ry="4" fill="none" stroke="#0f172a" stroke-width="1.3" opacity="0.65"/>
  </g>
</svg>
